<meta charset="utf-8">
<title>Lantern Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/rules.css">

<div id="app">
  <div id="frame">
    <canvas id="world" aria-label="The battlefield"></canvas>
    <div id="vig"></div>
    <div id="plates"></div>
    <div id="nums" aria-hidden="true"></div>
    <div id="banner"></div>
    <header id="hud" hidden>
      <div class="hud-top">
        <div id="hudStage" class="hud-stage"></div>
        <button id="hudRound" class="round" aria-label="Round and enrage"></button>
      </div>
    </header>
    <div id="flags" aria-label="Turn order: who acts next, and with what"></div>
    <div id="controls" hidden>
      <div id="pausedTag" hidden>Paused · tap Turn to play one turn</div>
      <button class="ctl" id="bMenu" aria-label="Menu"><svg viewBox="0 0 10 10"><path d="M1 2h8v1.4H1zM1 4.3h8v1.4H1zM1 6.6h8V8H1z"/></svg></button>
      <button class="ctl" id="bPlay" aria-label="Pause"></button>
      <button class="ctl wide" id="bStep" aria-label="Play the next turn, then pause"><svg viewBox="0 0 10 10"><path d="M1 1v8l5.5-4zM7 1h2v8H7z"/></svg>Turn</button>
      <button class="ctl" id="bSpeed" aria-label="Battle speed">1×</button>
      <button class="ctl wide skip" id="bSkip" aria-label="Skip to the result">Skip<svg viewBox="0 0 10 10"><path d="M1 1v8l4-4zM5 1v8l4-4z"/></svg></button>
    </div>
    <div id="shell" hidden>
      <header id="topbar">
        <div id="purse" aria-label="Gold and materials"></div>
        <button id="tbSettings" class="ctl" aria-label="Settings"></button>
      </header>
      <main id="views"></main>
      <nav id="tabbar" aria-label="Screens"></nav>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <section id="screen" hidden></section>
    <div id="sheet" hidden></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/battle.js"></script>
<script src="js/app.js"></script>
<script src="js/rules.js"></script>
<script src="js/main.js"></script>
