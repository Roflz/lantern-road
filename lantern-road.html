<meta charset="utf-8">
<title>Lantern Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Fonts ship with the game (fonts/, SIL Open Font License) so it works offline. */
@font-face{font-family:"Pirata One";src:url(fonts/pirata-one-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Silkscreen";src:url(fonts/silkscreen-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Silkscreen";src:url(fonts/silkscreen-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{
  /* Layout: one portrait road-frame centred in a violet night. The HUD rides its top edge, lane controls its bottom, and event cards rise from below into the lantern light. Cozy gothic: cold night, warm amber hearth. */
  --void:#0b0913;
  --night:#120e1c;
  --stone:#18121f;
  --stone-2:#231b2c;
  --rule:#3f344b;
  --bone:#f2e7d0;
  --ash:#b4a8b6;
  --dim:#7d7186;
  --ember:#f4a646;
  --ember-soft:rgba(244,166,70,.14);
  --blood:#d4484a;
  --oil:#f0b552;
  --gold:#f1d36a;
  --doom:#bb96ee;
  --ward:#8cc4e6;
  --good:#b4de98;
  --bad:#f08c76;
  --f-display:"Pirata One","Luminari","Palatino Linotype",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-pixel:"Silkscreen","Lucida Console","Courier New",monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--void)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--void);color:var(--bone);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;background:radial-gradient(ellipse at 50% 75%,#241629 0%,#130e1b 45%,var(--void) 75%)}
#frame{position:relative;height:100%;width:360px;max-width:100%;overflow:hidden;background:var(--night);box-shadow:0 0 0 1px var(--rule),0 0 90px rgba(0,0,0,.9)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
#vig{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 72%,transparent 40%,rgba(10,6,20,.55) 100%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.ico{width:14px;height:14px;image-rendering:pixelated;flex:none;display:inline-block;vertical-align:middle}
.ico.lg{width:21px;height:21px}
.ico.xl{width:28px;height:28px}

/* Frame shake, scaled by how hard the hit was */
#frame.shake1{animation:fshake .22s}
#frame.shake2{animation:fshake .32s;--amp:4px}
#frame.shake3{animation:fshake .45s;--amp:7px}
@keyframes fshake{20%{transform:translate(calc(var(--amp,2px)*-1),1px)}40%{transform:translate(var(--amp,2px),-1px)}60%{transform:translate(calc(var(--amp,2px)*-.6),0)}80%{transform:translate(calc(var(--amp,2px)*.4),1px)}}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:3;display:grid;gap:7px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 22px;background:linear-gradient(180deg,rgba(11,9,19,.96) 0%,rgba(11,9,19,.84) 72%,transparent);font-family:var(--f-pixel);font-size:10px;letter-spacing:.04em}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.region{font-family:var(--f-display);font-size:20px;line-height:1;white-space:nowrap}
.region b{font-weight:400;color:var(--ember);margin-right:6px}
.region .mode{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;color:var(--ember);border:1px solid var(--ember);padding:1px 4px;margin-left:8px;vertical-align:middle}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:7px;height:7px;background:#2d2536}
.pip.done{background:#7a6c82}
.pip.now{background:var(--ember);box-shadow:0 0 6px var(--ember)}
.pip.boss{width:10px;height:10px;background:#4a1a22;border:1px solid var(--blood)}
.pip.boss.now{background:var(--blood)}
.hud-bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:flex;align-items:center;gap:5px;min-width:0}
.bar b{font-weight:400;color:var(--bone);font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.meter{position:relative;flex:1;height:11px;background:#07050b;border:1px solid var(--rule);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#e9625f,var(--blood));transition:width .3s}
.meter.oil i{background:linear-gradient(180deg,#ffd27a,var(--oil))}
.meter.foe i{background:linear-gradient(180deg,#c95a5a,#9c2f35)}
.meter.low i{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.45}}
.hud-stats{display:flex;gap:6px;align-items:center}
.st{position:relative;display:inline-flex;align-items:center;gap:5px;padding:4px 7px;min-height:28px;background:rgba(0,0,0,.35);border:1px solid #2e2638;color:var(--bone);font:inherit;cursor:default}
.st b{display:inline-block;font-weight:400;font-variant-numeric:tabular-nums}
.st.g b{color:var(--gold)}
button.st{margin-left:auto;cursor:pointer}
button.st:hover{border-color:var(--ember)}
.st::after{content:"";position:absolute;inset:-7px -3px}
.st.bump b{animation:bump .4s}
@keyframes bump{35%{transform:scale(1.45);color:#fff;text-shadow:0 0 8px var(--ember)}}
.ahead{display:flex;gap:4px;align-items:stretch}
.slot{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 5px;border:1px solid #2d2536;background:rgba(0,0,0,.45);color:var(--ash);min-width:0}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.on{border-color:var(--ember);color:var(--bone);background:var(--ember-soft)}
.slot.boss{border-color:var(--blood);color:#ffd0c8;background:rgba(212,72,74,.12)}

/* Controls */
#controls{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#controls button{pointer-events:auto;cursor:pointer}
.pad{width:60px;height:60px;display:grid;place-items:center;background:rgba(14,10,22,.72);border:2px solid var(--rule);color:var(--bone)}
.pad:hover,.pad:active{border-color:var(--ember);color:var(--ember)}
.pad svg{width:20px;height:20px;fill:currentColor}
.pad.nudge{animation:nudge 1s ease-in-out 3;border-color:var(--ember);color:var(--ember)}
@keyframes nudge{50%{box-shadow:0 0 18px rgba(244,166,70,.6)}}
.mid{display:flex;gap:6px}
.small{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:var(--f-pixel);font-size:10px;min-width:48px;min-height:44px;padding:0 9px;background:rgba(14,10,22,.72);border:2px solid var(--rule);color:var(--ash);cursor:pointer}
.small:hover{border-color:var(--ember);color:var(--bone)}
.small[aria-pressed="true"],.small.on{border-color:var(--ember);color:var(--ember);background:var(--ember-soft)}
.small svg{width:14px;height:14px;fill:currentColor}

/* Toasts, region card, hurt flash, tips and hints */
#toasts{position:absolute;left:0;right:0;bottom:118px;z-index:4;display:grid;justify-items:center;gap:4px;pointer-events:none}
.toast{display:flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:11px;padding:4px 9px;background:rgba(10,7,16,.85);border:1px solid var(--rule);color:var(--bone);animation:toast 2.2s forwards}
.toast.good{color:var(--good)}
.toast.bad{color:var(--bad);border-color:#5a2a2a}
.toast.gold{color:var(--gold);border-color:#6a5420}
@keyframes toast{0%{opacity:0;transform:translateY(6px) scale(.9)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#card{position:absolute;left:0;right:0;top:30%;z-index:4;text-align:center;pointer-events:none;opacity:0}
#card.show{animation:card 3.4s forwards}
#card .n{font-family:var(--f-pixel);font-size:11px;letter-spacing:.35em;color:var(--ember)}
#card .t{font-family:var(--f-display);font-size:48px;line-height:1;text-shadow:0 0 26px rgba(244,166,70,.35),0 2px 0 #000}
@keyframes card{0%{opacity:0;transform:translateY(10px) scale(.96);letter-spacing:.08em}15%{opacity:1;transform:none;letter-spacing:0}75%{opacity:1}100%{opacity:0}}
#hurt{position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 70px rgba(212,72,74,0);transition:box-shadow .35s}
#hurt.on{box-shadow:inset 0 0 70px rgba(212,72,74,.75);transition:none}
#tip{position:absolute;z-index:14;max-width:230px;padding:8px 10px;background:#0f0b15;border:1px solid var(--ember);color:var(--bone);font-size:13.5px;line-height:1.4;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:tipin .15s ease-out}
#tip b{display:block;font-family:var(--f-pixel);font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember);margin-bottom:3px}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}}
#hint{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:7;display:flex;gap:10px;align-items:center;padding:10px 10px 10px 12px;background:rgba(20,14,26,.96);border:1px solid var(--ember);box-shadow:0 0 26px rgba(244,166,70,.28),0 0 0 2px #000;animation:hintin .35s ease-out}
#hint p{margin:0;flex:1;line-height:1.4;font-size:14px}
@keyframes hintin{from{opacity:0;transform:translateY(-10px)}}
.fly{position:absolute;z-index:11;width:16px;height:16px;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 0 4px rgba(244,166,70,.7))}

/* Event panel */
#panel{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;max-height:calc(100% - 132px);overflow:auto;background:linear-gradient(180deg,#1e1725,var(--stone) 120px);border:2px solid var(--rule);box-shadow:0 0 0 2px #000,inset 0 1px 0 rgba(244,166,70,.22),0 -30px 60px rgba(0,0,0,.75);padding:16px 14px 14px;animation:rise .3s cubic-bezier(.2,.9,.3,1.15)}
#panel.tall{max-height:calc(100% - 16px)}
@keyframes rise{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.kicker{font-family:var(--f-pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:29px;line-height:1.02;margin-top:3px}
.ev-head{display:flex;gap:12px;align-items:center}
.ev-head .ico{width:46px;height:46px;filter:drop-shadow(0 0 8px rgba(244,166,70,.35))}
.ev-text{line-height:1.55;margin:10px 0 14px;max-width:60ch}
.choices{display:grid;gap:8px}
.btn{display:block;width:100%;text-align:left;font-family:var(--f-pixel);font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.35;background:var(--stone-2);color:var(--bone);border:2px solid var(--rule);padding:11px 12px;min-height:44px;cursor:pointer;transition:transform .08s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ember);box-shadow:0 0 14px rgba(244,166,70,.22)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn .key{color:var(--ember);margin-right:8px}
.btn .ico{margin-right:6px;margin-top:-2px}
.btn .sub{display:block;margin-top:3px;font-family:var(--f-body);font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ash);line-height:1.35}
.btn.primary{border-color:var(--ember)}
.price{float:right;display:inline-flex;align-items:center;gap:4px;color:var(--gold)}
.price .ico{margin:0}
.lines{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px;font-family:var(--f-pixel);font-size:11px}
.lines li{display:flex;align-items:center;gap:7px;animation:linein .35s both}
.lines li:nth-child(2){animation-delay:.08s}.lines li:nth-child(3){animation-delay:.16s}.lines li:nth-child(4){animation-delay:.24s}.lines li:nth-child(5){animation-delay:.32s}.lines li:nth-child(6){animation-delay:.4s}
@keyframes linein{from{opacity:0;transform:translateX(-8px)}}
.lines .good{color:var(--good)}
.lines .bad{color:var(--bad)}
.lines .note{color:var(--ash)}

/* Relic reveal */
.reveal{position:relative;display:grid;justify-items:center;gap:4px;padding:2px 0 8px}
.reveal .chest{width:64px;height:64px;image-rendering:pixelated;animation:chest .55s steps(5) both}
.reveal .glow{position:absolute;top:-6px;width:140px;height:90px;background:radial-gradient(ellipse at 50% 55%,var(--tier,rgba(244,166,70,.55)),transparent 65%);animation:glow .8s ease-out both;pointer-events:none}
@keyframes chest{0%,60%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}}
@keyframes glow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.relic-pick{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-transform:none;animation:cardin .4s both}
.relic-pick:nth-child(2){animation-delay:.08s}.relic-pick:nth-child(3){animation-delay:.16s}.relic-pick:nth-child(4){animation-delay:.24s}
.relic-pick>.ico{grid-row:1/3;width:28px;height:28px;margin:0}
.setpips .ico{width:14px;height:14px;margin:0 2px 0 0}
.relic-pick .nm{font-family:var(--f-display);font-size:19px;letter-spacing:0;line-height:1.05}
.relic-pick .sub{grid-column:2;margin:0}
.relic-pick .setpips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.setpips{align-items:center}
.setpips i{width:7px;height:7px;background:#3a3046;border:1px solid #5d5068}
.setpips i.on{background:var(--ember);border-color:var(--ember)}
@keyframes cardin{from{opacity:0;transform:translateY(12px) scale(.97)}}

/* Combat */
.combat{display:grid;gap:10px}
.foe{position:relative;display:grid;justify-items:center;gap:6px;text-align:center}
.foe canvas{width:132px;height:143px;image-rendering:pixelated;background:radial-gradient(circle at 50% 62%,rgba(244,166,70,.16),transparent 62%);animation:bob 1.6s steps(2) infinite}
.foe.boss canvas{width:168px;height:182px}
.foe canvas.hit{animation:shake .32s}
.foe canvas.flash{filter:brightness(2.6) saturate(.4)}
.foe canvas.lunge{animation:lunge .28s ease-in}
.foe canvas.dead{animation:sink .6s forwards}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes lunge{50%{transform:translateY(14px) scale(1.12)}}
@keyframes sink{to{transform:translateY(20px);opacity:0;filter:brightness(3)}}
.intent{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:12px;padding:4px 10px 4px 7px;background:#07050b;border:1px solid var(--blood);color:#f6c0b2;cursor:help}
.intent b{font-size:15px;font-weight:700;color:#fff}
.intent.def{border-color:var(--ward);color:var(--ward)}
.intent.cur{border-color:var(--doom);color:var(--doom)}
.intent.nudge{animation:nudge 1s ease-in-out 3}
.foe-name{font-family:var(--f-display);font-size:25px;line-height:1}
.foe .meter{width:min(240px,100%);flex:none;height:13px}
.meter>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:1px 1px 0 #000;font-family:var(--f-pixel);font-size:9px}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-family:var(--f-pixel);font-size:10px;min-height:20px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 4px;border:1px solid var(--rule);color:var(--ash);cursor:help}
.tag.block{border-color:var(--ward);color:var(--ward)}
.tag.doom{border-color:var(--doom);color:var(--doom)}
.tag.weak,.tag.bleed,.tag.rage{border-color:#6a2a2a;color:var(--bad)}
.tag.buff{border-color:var(--ember);color:var(--ember)}
.log{font-style:italic;color:var(--ash);text-align:center;min-height:1.5em;margin:0;line-height:1.4}
.me{position:relative;display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--rule)}
.me-row{display:flex;gap:8px;align-items:center}
.me-row .tags{justify-content:flex-end;min-width:0}
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.actions .btn{grid-column:span 2;text-align:center;padding:9px 4px}
.actions .btn.wide{grid-column:span 3}
.actions .btn .ico{display:block;margin:0 auto 4px;width:21px;height:21px}
.actions .btn.wide .ico{display:inline-block;margin:-3px 6px 0 0;width:14px;height:14px}
.actions .btn .sub{font-size:12px}
.fx{position:absolute;left:50%;top:38%;z-index:2;font-family:var(--f-pixel);font-weight:700;font-size:18px;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;animation:up .95s ease-out forwards;transform:translateX(-50%);white-space:nowrap}
.fx.big{font-size:26px;color:#ffe3a6}
.fx.huge{font-size:34px;color:#ffd06a;text-shadow:0 0 12px rgba(244,166,70,.8),2px 2px 0 #000}
.fx.heal{color:var(--good)}
.fx.doom{color:var(--doom)}
.fx.ward{color:var(--ward)}
.fx.me{top:-6px}
.fx.proc{font-size:11px;font-weight:400;color:var(--ember);top:58%}
.fx.me.proc{top:16px}
@keyframes up{0%{transform:translate(-50%,6px) scale(.6)}18%{transform:translate(-50%,-6px) scale(1.15)}100%{transform:translate(-50%,-38px) scale(1);opacity:0}}
.math{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;font-family:var(--f-pixel);font-size:10px;font-variant-numeric:tabular-nums}
.math>*{animation:mathin .25s both}
.math>*:nth-child(2){animation-delay:.05s}.math>*:nth-child(3){animation-delay:.1s}.math>*:nth-child(4){animation-delay:.15s}.math>*:nth-child(5){animation-delay:.2s}.math>*:nth-child(6){animation-delay:.25s}.math>*:nth-child(7){animation-delay:.3s}.math>*:nth-child(n+8){animation-delay:.35s}
@keyframes mathin{from{opacity:0;transform:translateY(4px) scale(.8)}}
.math .chip{padding:2px 5px;border:1px solid var(--rule);background:#07050b;color:var(--bone)}
.math .chip.relic{border-color:var(--ember);color:var(--ember)}
.math .chip.bad{border-color:#6a2a2a;color:var(--bad)}
.math .op{color:var(--ash)}
.math b{font-size:15px;font-weight:700;color:#fff;margin-left:2px}
.math .note{color:var(--ward);margin-left:4px}

/* Full screens */
#screen{position:absolute;inset:0;z-index:8;overflow:auto;display:flex;flex-direction:column;padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(11,9,19,.2) 0%,rgba(11,9,19,.82) 46%,rgba(11,9,19,.97) 100%)}
#screen.solid{background:rgba(13,10,20,.94)}
.title-wrap{margin-top:auto;display:grid;gap:8px}
.title{font-size:clamp(56px,16vw,80px);line-height:.86;color:var(--bone);text-shadow:0 0 30px rgba(244,166,70,.55),0 3px 0 #000;animation:titlein 1.2s ease-out both}
@keyframes titlein{from{opacity:0;transform:translateY(8px);text-shadow:0 0 0 rgba(244,166,70,0)}}
.tagline{margin:2px 0 0;color:var(--ash);font-style:italic;line-height:1.45;max-width:34ch}
.menu{display:grid;gap:8px;margin-top:16px}
.play{text-align:center;font-size:14px;padding:16px 12px;background:linear-gradient(180deg,#3d2816,#2a1a0e);border-color:var(--ember);box-shadow:0 0 22px rgba(244,166,70,.25),inset 0 1px 0 rgba(255,220,160,.25);animation:breathe 2.6s ease-in-out infinite}
.play .sub{text-align:center;color:#d9c3a4}
@keyframes breathe{50%{box-shadow:0 0 32px rgba(244,166,70,.42),inset 0 1px 0 rgba(255,220,160,.25)}}
.textbtn{background:none;border:none;color:var(--ash);font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;text-transform:uppercase;min-height:44px;cursor:pointer;justify-self:center}
.textbtn:hover{color:var(--bone)}
.daily{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}

.unlockbar{display:grid;gap:5px;padding:9px 12px;background:rgba(0,0,0,.3);border:1px solid var(--rule);font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ash)}

@media (hover:none){.foot,.btn .key{display:none}}
.page{display:grid;gap:14px;align-content:start}
.page h1{font-size:40px;line-height:1}

.back{justify-self:start;width:auto}
.embers{display:flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:12px;color:var(--ember)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;background:var(--stone-2);border:1px solid var(--rule)}
.item .k,.item .nm{grid-column:1}
.item.locked{opacity:.55}
.item .k.got{color:var(--good)}
.item .k{display:flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.item .nm{font-family:var(--f-display);font-size:21px;line-height:1.05}

table.rec{width:100%;border-collapse:collapse;font-family:var(--f-pixel);font-size:10px;font-variant-numeric:tabular-nums}

.rec td.num,.rec th.num{text-align:right}
.rec .won{color:var(--ember)}
.score{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-family:var(--f-pixel);font-size:11px;font-variant-numeric:tabular-nums;padding:12px;background:var(--stone-2);border:1px solid var(--rule)}
.score>span{animation:linein .3s both;animation-delay:calc(var(--i,0)*.12s)}

// Gameplay randomness comes from the run's own seeded generator (mulberry32), so the Daily Road is the same

function rng() {

const strSeed = s => { let x = 2166136261; for (const ch of s) x = Math.imul(x ^ ch.charCodeAt(0), 16777619); return x | 0; };

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function hash(n) { n |= 0; n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n ^= n >>> 16; return (n >>> 0) / 4294967296; }

function h(tag, attrs, ...kids) {

function openEvent(type, beat) {
  run.event = true;
  switch (type) {
    case 'fight': {
      const R = REGIONS[run.region];
      const id = (beat && beat.foe) || pick(R.normals.filter(n => n !== run.lastFoe));
      run.lastFoe = id; return startCombat(id, 'normal');
    }
    case 'elite': return startCombat(REGIONS[run.region].elite, 'elite');
    case 'boss': return startCombat(REGIONS[run.region].boss, 'boss');
    case 'mystery': return openMystery();
    case 'camp': return openCamp();
    case 'merchant': return openMerchant();
    case 'shrine': return openShrine();
    case 'treasure': return openTreasure();

}

function openMystery() {
  let pool = MYSTERIES.filter(m => pooled(m.unlock) && !run.seen.includes(m.id));
  if (!pool.length) { run.seen = []; pool = MYSTERIES.filter(m => pooled(m.unlock)); }
  const m = pick(pool); run.seen.push(m.id);
  // Auto mode takes the first option, or the last (usually the safe one) when health is low.
  eventCard({ art: 'mystery', kicker: 'Mystery', title: m.title, text: m.text, choices: m.choices(), autoPick: () => run.hp < run.maxHp * .35 ? -1 : 0 });
}

// ── Daily Road: one shared road per calendar day, the same seed and class for every player.

}

  startRun(dailyClass(key), { seed: strSeed('lantern-road:' + key), daily: key });
}
function recordDaily(key, total, won) {

  if (dly.results.some(r => r.date === key)) return;
  dly.results.push({ date: key, score: total, won }); dly.results = dly.results.slice(-30);
  const yesterday = (() => { const [y, m, d] = key.split('-').map(Number); const t = new Date(y, m - 1, d - 1); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; })();
  dly.streak = dly.last === yesterday ? dly.streak + 1 : 1;
  dly.last = key; dly.best = Math.max(dly.best, total);
}
// The streak only counts while you have played yesterday's or today's road.
const liveStreak = () => (meta.daily.last === todayKey() || meta.daily.last === todayKey(-1)) ? meta.daily.streak : 0;

function endRun(won, cause) {

  const base = run.score, gold = run.gold;
  let total = base + gold;
  if (won) total = Math.round((total + 500) * 1.5);
  total = Math.round(total * darkMult(run.dark));
  let embers = Math.max(1, Math.floor(total / 100));
  if (run.daily) embers *= 2;
  meta.embers += embers; meta.runs++;
  meta.records.push({ score: total, cls: run.cls, region: run.region, won, date: todayKey(), dark: run.dark, daily: !!run.daily });
  meta.records.sort((a, b) => b.score - a.score); meta.records = meta.records.slice(0, 10);
  const prevDark = meta.dark;
  if (won && run.dark >= meta.dark && meta.dark < 5) meta.dark = run.dark + 1;
  if (run.daily) recordDaily(run.daily, total, won);
  commitMeta();
  award('first');
  if (won) { award('win_' + run.cls); if (run.dark >= 1) award('dark1'); if (run.dark >= 5) award('dark5'); }
  if (run.daily) { award('daily1'); if (meta.daily.streak >= 3) award('streak3'); if (meta.daily.streak >= 7) award('streak7'); }
  lastRun = { won, cause, total, embers, gold, kills: run.kills, elites: run.elites, bosses: run.bosses, regions: run.regionsCleared, region: run.region, cls: run.cls,
    dark: run.dark, daily: run.daily, newAch: run.newAch.slice(), unlockedDark: meta.dark > prevDark ? meta.dark : 0,
    best: meta.records[0] && meta.records[0].score === total };

}

// ── The Pyre: a campfire where every unlock lights one of the lanterns around it.
const PYRE_W = 120, PYRE_H = 64;

    const p = pyreSpot(i), lit = unlocked(u.id), flash = pyreFlash[i] ? Math.max(0, 1 - (now - pyreFlash[i]) / 1200) : 0;

    x.fillStyle = lit ? '#8a6a3a' : '#3a3240'; x.fillRect(p.x - 1, p.y - 11, 3, 4);
    x.fillStyle = lit ? (flash > 0 ? '#fffbe0' : '#ffc65a') : '#221c28'; x.fillRect(p.x, p.y - 10, 1, 2);
    if (lit || flash) {

      const gg = x.createRadialGradient(p.x, p.y - 9, 0, p.x, p.y - 9, r); gg.addColorStop(0, `rgba(255,180,80,${.35 + flash * .5})`); gg.addColorStop(1, 'rgba(0,0,0,0)');

    h('div', { class: 'version', text: 'Lantern Road · 1.0' })), true);
}

// ── The end of a walk: the score adds up line by line, then the embers fill the next unlock.
function showEnd() {
  screen = 'end';
  const r = lastRun, R = REGIONS[r.region];
  let i = 0;
  const row = (a, b) => { const k = i++; return [h('span', { style: `--i:${k}`, text: a }), h('span', { style: `--i:${k}`, text: b })]; };
  const achs = r.newAch.map(id => ACHIEVEMENTS.find(a => a.id === id)).filter(Boolean);
  const total = h('span', { class: 'tot', text: '0' });
  const rows = [
    row(`Foes slain · ${r.kills} × 10`, fmt(r.kills * 10)), row(`Elites slain · ${r.elites} × 50`, fmt(r.elites * 50)),
    row(`Bosses ended · ${r.bosses} × 200`, fmt(r.bosses * 200)), row(`Regions cleared · ${r.regions} × 100`, fmt(r.regions * 100)),
    row('Gold carried', fmt(r.gold)),
    r.won ? row('Victory', '+500') : null, r.won ? row('Victory bonus', '× 1.5') : null,
    r.dark ? row(DARKNESS[r.dark].name, `× ${darkMult(r.dark)}`) : null];
  const totalLabel = h('span', { class: 'tot', style: `--i:${i}`, text: r.best ? 'Final score · your best' : 'Final score' });
  total.style.setProperty('--i', i);
  setScreen(h('div', { class: 'page' },
    h('div', { class: 'kicker', text: (r.won ? 'Victory' : 'The walk is over') + (r.daily ? ` · Daily Road` : '') }),
    h('h1', { text: r.won ? 'The Hollow King is Ended' : `You Fell in the ${R.name}` }),
    h('p', { class: 'tagline', text: r.won ? 'The crown is dust, and the road behind you is lit.' : r.cause + '.' }),
    h('div', { class: 'score' }, rows, totalLabel, total),
    h('div', { class: 'embers' }, ico('ember'), `+${plural(r.embers, 'ember')}${r.daily ? ', doubled by the Daily Road' : ''}`),
    unlockBar(r.embers),
    r.daily ? h('p', { class: 'tagline', text: `${plural(meta.daily.streak, 'day')} in a row on the Daily Road. A new road opens tomorrow.` }) : null,
    r.unlockedDark ? h('p', { class: 'tagline', text: `${DARKNESS[r.unlockedDark].name} awaits: ${DARKNESS[r.unlockedDark].desc}` }) : null,
    achs.length ? h('div', { class: 'list' }, achs.map(a => h('div', { class: 'item' }, h('div', { class: 'k got' }, ico('trophy'), `Achievement · +${plural(a.embers, 'ember')}`), h('div', { class: 'nm', text: a.name }), h('div', { class: 'ds', text: a.desc })))) : null,
    h('div', { class: 'menu' }, menuBtn('Walk again', null, beginWalk, true),
      menuBtn('Visit the Pyre', nextUnlock() && meta.embers >= nextUnlock().cost ? 'Something is ready to kindle' : plural(meta.embers, 'ember') + ' to spend', showPyre, false, 'camp'),
      menuBtn('Title', null, showTitle))));
  // count the total up once the rows have landed
  const start = performance.now() + (noMotion() ? 0 : i * 120 + 200), dur = noMotion() ? 1 : 900;
  let lastTick = 0;
  const step = now => {
    if (!total.isConnected) return;
    const k = clamp((now - start) / dur, 0, 1), v = Math.round(r.total * (1 - (1 - k) ** 3));
    total.textContent = fmt(v);
    if (k > 0 && k < 1 && now - lastTick > 70) { sfx('tick'); lastTick = now; }
    if (k < 1) requestAnimationFrame(step); else if (r.best || r.won) sfx('win');
  };
  requestAnimationFrame(step);
}

// ── Codex: achievements, the foes you have met (with what you have learned of them), and the relics you have found.
function silhouette(c) { const x = c.getContext('2d'); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#2e2738'; x.fillRect(0, 0, c.width, c.height); return c; }
const foeRegion = id => REGIONS.find(R => R.normals.includes(id) || R.elite === id || R.boss === id);
function openLore(id) {
  const d = ENEMIES[id], n = meta.foes[id] || 0, R = foeRegion(id);
  const moves = [...new Set(d.pat)].map(m => { const I = intentInfo(parseIntent(m), 0); return h('span', { class: 'intent ' + I.cls, 'data-tip': I.tip }, ico(I.icon), I.text !== '' ? h('b', { text: I.text }) : null); });
  openSheet(h('div', { class: 'lore' },
    h('div', { class: 'k', text: `${R ? R.name : 'A mystery on the road'} · defeated ×${n}` }), h('h2', { text: d.name }), portrait(id),
    h('p', { text: d.intro }),
    n >= 3 ? h('div', { class: 'tags' }, moves) : h('div', { class: 'k', text: 'Defeat it 3 times to learn its moves.' }),
    n >= 5 ? h('p', { text: d.death }) : h('div', { class: 'k', text: 'Defeat it 5 times to learn how it ends.' }),
    h('button', { class: 'btn primary', onclick: closeSheet, text: 'Close' })));
}
function showCodex(tab) {
  screen = 'codex';
  const tabs = h('div', { class: 'tabs', role: 'tablist' }, [['ach', 'Achievements'], ['foes', 'Bestiary'], ['relics', 'Relics']].map(([id, label]) =>
    h('button', { class: 'small' + (tab === id ? ' on' : ''), role: 'tab', 'aria-selected': tab === id ? 'true' : 'false', onclick: () => showCodex(id), text: label })));
  let body, lead;
  if (tab === 'ach') {
    lead = `${meta.ach.length} of ${ACHIEVEMENTS.length} earned`;
    body = h('div', { class: 'list' }, ACHIEVEMENTS.map(a => { const got = meta.ach.includes(a.id);
      return h('div', { class: 'item' + (got ? '' : ' locked') }, h('div', { class: 'k' + (got ? ' got' : '') }, ico(got ? 'trophy' : 'lock'), `+${plural(a.embers, 'ember')}`), h('div', { class: 'nm', text: a.name }), h('div', { class: 'ds', text: a.desc })); }));
  } else if (tab === 'foes') {
    const ids = REGIONS.flatMap(R => [...R.normals, R.elite, R.boss]).concat(['mimic', 'moths']);
    lead = `${ids.filter(id => meta.foes[id]).length} of ${ids.length} met · tap one to read about it`;
    body = h('div', { class: 'beasts' }, ids.map(id => { const n = meta.foes[id] || 0, d = ENEMIES[id], where = foeRegion(id);
      const pc = portrait(id); if (!n) silhouette(pc);
      return h(n ? 'button' : 'div', { class: 'beast' + (n ? '' : ' unseen'), onclick: n ? () => { sfx('click'); openLore(id); } : null }, pc, h('div', { class: 'nm', text: n ? d.name : 'Unknown' }), h('div', { class: 'k', text: n ? `Defeated ×${n}` : (where ? where.name : 'A mystery') })); }));
  } else {
    lead = `${meta.relicsSeen.length} of ${Object.keys(RELICS).length} found`;
    body = h('div', { class: 'list' },
      Object.keys(SETS).map(t => h('div', { class: 'item' }, h('div', { class: 'k' }, ico(TAG_ICONS[t]), `${TAG_NAMES[t]} set · carry 3 ${TAG_NAMES[t]} relics`), h('div', { class: 'nm', text: SETS[t].name }), h('div', { class: 'ds', text: SETS[t].desc }))),
      Object.keys(RELICS).map(id => { const seen = meta.relicsSeen.includes(id), R = RELICS[id];
        return h('div', { class: 'item' + (seen ? '' : ' locked') }, h('div', { class: 'k' }, ico(seen ? (R.tag ? TAG_ICONS[R.tag] : 'relic') : 'lock'), (R.tag ? TAG_NAMES[R.tag] : 'Relic') + (seen ? '' : ' · not yet found')), h('div', { class: 'nm', text: seen ? R.name : '???' }), h('div', { class: 'ds', text: seen ? R.desc : 'Find it on the road to learn what it does.' })); }));
  }
  setScreen(h('div', { class: 'page' }, backBtn(showTitle), h('div', { class: 'kicker', text: lead }), h('h1', { text: 'Codex' }), tabs, body), true);
}

// ───────────────────────── sheet: pause and relics
const sheet = $('#sheet');
function openSheet(el) { sheet.replaceChildren(h('div', { class: 'box', role: 'dialog' }, el)); sheet.hidden = false; hideTip(); const b = sheet.querySelector('.btn'); if (b && matchMedia('(hover:hover)').matches) b.focus({ preventScroll: true }); }
function closeSheet() { sheet.hidden = true; sheet.replaceChildren(); }
function openRelics() {
  if (!run) return; const wasPaused = paused; paused = true;
  const close = () => { closeSheet(); paused = wasPaused; };
  const list = run.relics.length ? run.relics.map(id => h('div', { class: 'relic' }, ico(RELICS[id].tag ? TAG_ICONS[RELICS[id].tag] : 'relic'), h('b', { text: RELICS[id].name }), h('span', { text: RELICS[id].desc })))
    : [h('p', { class: 'ev-text', text: 'No relics yet. Elites, shrines, merchants and bosses carry them.' })];
  const sets = Object.keys(SETS).filter(t => tagCount(t) > 0).map(t => h('div', { class: 'relic' + (setOn(t) ? ' set-on' : '') }, ico(TAG_ICONS[t]),
    h('b', {}, SETS[t].name, h('span', { class: 'setpips' }, [0, 1, 2].map(k => h('i', { class: k < tagCount(t) ? 'on' : '' })))), h('span', { text: (setOn(t) ? 'Awake. ' : `${TAG_NAMES[t]} ${tagCount(t)} of 3. `) + SETS[t].desc })));
  const c = CLASSES[run.cls];
  openSheet(h('div', { style: 'display:grid;gap:10px' },
    h('div', { class: 'kicker', text: `${c.name} · Strike ${strikeBase()} · Guard ${guardVal()}` }), h('h2', { text: 'Your Relics' }),
    h('p', { class: 'ev-text', style: 'margin:0', text: `${c.skill.name} (level ${run.skillLv}): ${c.skill.desc(run.skillLv)} ${c.passive}` }),
    ...sets, ...list, h('button', { class: 'btn primary', onclick: close, text: 'Back to the road' })));
}
function togglePause() {
  if (!run || screen !== 'travel') return;
  if (!sheet.hidden) { closeSheet(); paused = false; return; }
  openPause();
}
function openPause(confirming) {
  paused = true;
  const resume = () => { closeSheet(); paused = false; };
  openSheet(h('div', { style: 'display:grid;gap:10px' },
    h('div', { class: 'kicker', text: 'Paused' }), h('h2', { text: confirming ? 'Turn back?' : 'Rest a Moment' }),
    confirming ? h('p', { class: 'ev-text', style: 'margin:0', text: 'Your walk ends here and is scored as it stands. You still earn your embers.' }) : null,
    confirming
      ? [menuBtn('Turn back', null, () => { closeSheet(); paused = false; if (run) { run.dead = 'Turned back in the ' + regionName(); endRun(false, run.dead); } }), menuBtn('Keep walking', null, resume, true)]
      : [menuBtn('Resume', null, resume, true),
        ...settingRows(() => openPause()),
        menuBtn('How to play', null, () => openSheet(h('div', { style: 'display:grid;gap:10px' }, h('h2', { text: 'How to Play' }), howToContent(), menuBtn('Back', null, () => openPause(), true)))),
        menuBtn('Turn back', 'End this walk and keep your score', () => openPause(true))]));
}

// ───────────────────────── auto mode
// When on, the game plays itself: it picks forks, chases pickups, fights and answers events.
let autoAt = 0;
const autoDelay = () => 750 / speed;
function forkScore(t) {
  const hp = run.hp / run.maxHp;
  switch (t) {
    case 'camp': return hp < .5 ? 10 : run.skillLv < 3 ? 4 : 2;
    case 'merchant': return run.gold >= 40 ? 6 : 1;
    case 'elite': return hp > .7 ? 7 : 0;
    case 'treasure': return 5;
    case 'mystery': return 4;
    case 'shrine': return run.gold >= 35 + 5 * run.region || hp > .6 ? 4 : 1;
    case 'fight': return hp > .4 ? 3 : 1;
  }
  return 0;
}
function bestLane(opts) {
  let best = run.lane, bestScore = -Infinity;
  opts.forEach((o, l) => { const s = forkScore(o) - Math.abs(l - run.lane) * .01; if (s > bestScore) { bestScore = s; best = l; } });
  return best;
}
function autoSteer() {
  const b = run.beats[run.beatIdx];
  let target = run.lane;
  const forkNear = b && b.kind === 'fork' && beatPos(run.beatIdx) - run.dist < 70;
  if (forkNear) target = bestLane(b.opts);
  else {
    const p = run.pickups.find(p => !p.done && p.pos > run.dist && p.pos - run.dist < 60);
    if (p) target = p.lane; else if (b && b.kind === 'fork') target = bestLane(b.opts);
  }
  if (target !== run.lane) move(Math.sign(target - run.lane));
}
function autoCombat() {
  const it = intentOf(), s = C.e.str;
  const inc = 'ADL'.includes(it.t) ? it.n + s : it.t === 'M' ? (it.n + s) * it.x : 0;
  if (run.draughts && run.hp < run.maxHp * .35) return act('draught');
  if (C.cd === 0) return act('skill');
  if (inc >= 10 || (run.cls === 'sellsword' && inc >= guardVal() && !C.riposte)) return act('guard');
  return act('strike');
}
function autoTick(now) {
  if (!auto || !run || run.over || screen !== 'travel' || paused || !sheet.hidden) return;
  if (!run.event) return autoSteer();
  if (now < autoAt) return;
  if (C && C.ui && !C.over) {
    if (C.busy) return;
    autoAt = now + autoDelay();
    return autoCombat();
  }
  if (panel.hidden) return;
  autoAt = now + autoDelay();
  const btns = [...panel.querySelectorAll('.btn[data-k]')], open = btns.filter(b => !b.disabled);
  const i = panelPick ? panelPick() : 0;
  const b = i === -1 ? open[open.length - 1] : (btns[i] && !btns[i].disabled ? btns[i] : open[0]);
  if (b) b.click();
}

// ───────────────────────── input
$('#btnL').addEventListener('click', () => move(-1));
$('#btnR').addEventListener('click', () => move(1));
$('#btnPause').addEventListener('click', togglePause);
function syncPlayButtons() {
  const sb = $('#btnSpeed'), ab = $('#btnAuto');
  if (!speedList().includes(speed)) speed = 1;
  sb.textContent = speed + '×'; sb.classList.toggle('on', speed > 1);
  ab.setAttribute('aria-pressed', auto ? 'true' : 'false');
}
function cycleSpeed() { const l = speedList(); speed = l[(l.indexOf(speed) + 1) % l.length]; savePlayPrefs(); syncPlayButtons(); }
function toggleAuto() { auto = !auto; autoAt = performance.now() + autoDelay(); savePlayPrefs(); syncPlayButtons(); toast(auto ? 'Auto play on' : 'Auto play off'); }
$('#btnSpeed').addEventListener('click', cycleSpeed);
$('#btnAuto').addEventListener('click', toggleAuto);
syncPlayButtons();
cv.addEventListener('pointerdown', e => {
  if (!run || screen !== 'travel') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < .4) move(-1); else if (x > .6) move(1);
});
document.addEventListener('keydown', e => {
  const k = e.key;
  if (!sheet.hidden) { if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); togglePause(); } return; }
  if (/^[1-9]$/.test(k) && !panel.hidden) {
    const b = panel.querySelector(`.btn[data-k="${k}"]`);
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
    return;
  }
  if (screen !== 'travel' || !run) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); move(-1); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); move(1); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); togglePause(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && run && screen === 'travel' && !run.event && sheet.hidden) openPause();
  if (document.hidden) saveRun();
  if (AC) { if (document.hidden) AC.suspend(); else if (music.on || settings.sfx) AC.resume(); }
});
window.addEventListener('pagehide', saveRun);
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#app'));

// ───────────────────────── boot
function start(data) {
  resize();
  if (data && data.run && data.meta) {
    run = data.run; meta = normalizeMeta(data.meta); screen = 'travel'; scr.hidden = true;
    run.event = false; C = null; openPause();
  } else showTitle();
  requestAnimationFrame(loop);
  initCloud();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ meta, run: run && screen === 'travel' && !run.event && !run.over ? run : null }));
} catch (e) { }
(() => {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
