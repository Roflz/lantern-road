<meta charset="utf-8">
<title>Lantern Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Fonts ship with the game (fonts/, SIL Open Font License) so it works offline. */
@font-face{font-family:"Pirata One";src:url(fonts/pirata-one-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Silkscreen";src:url(fonts/silkscreen-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Silkscreen";src:url(fonts/silkscreen-700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Spectral";src:url(fonts/spectral-600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{
  /* Layout: one portrait road-frame centred in the void. The HUD rides its top edge, lane controls its bottom, and event cards rise from below into the lantern light. */
  --void:#0a080e;
  --stone:#15111a;
  --stone-2:#1f1926;
  --rule:#3a3044;
  --bone:#ebe1cb;
  --ash:#a59bab;
  --ember:#f2a03d;
  --blood:#c43b3b;
  --oil:#e3ad4b;
  --gold:#e9d27c;
  --doom:#b48ae8;
  --ward:#86bde0;
  --good:#a5d48e;
  --bad:#e9806e;
  --f-display:"Pirata One","Luminari","Palatino Linotype",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-pixel:"Silkscreen","Lucida Console","Courier New",monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--void)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--void);color:var(--bone);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;background:radial-gradient(ellipse at 50% 70%,#1b1322 0%,var(--void) 65%)}
#frame{position:relative;height:100%;width:360px;max-width:100%;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--rule),0 0 90px rgba(0,0,0,.9)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:3;display:grid;gap:7px;padding:10px 10px 22px;background:linear-gradient(180deg,rgba(10,8,14,.96) 0%,rgba(10,8,14,.86) 72%,transparent);font-family:var(--f-pixel);font-size:10px;letter-spacing:.04em}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.region{font-family:var(--f-display);font-size:20px;line-height:1;white-space:nowrap}
.region b{font-weight:400;color:var(--ember);margin-right:6px}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:7px;height:7px;background:#2b2433}
.pip.done{background:#6d6474}
.pip.now{background:var(--ember)}
.pip.boss{width:10px;height:10px;background:#4a1a20;border:1px solid var(--blood)}
.pip.boss.now{background:var(--blood)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{position:relative;height:15px;background:#050407;border:1px solid var(--rule);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--blood);transition:width .25s}
.meter.oil i{background:var(--oil)}
.meter.low i{animation:pulse 1s steps(2) infinite}
.meter>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 5px;color:#fff;text-shadow:1px 1px 0 #000;font-size:9px}
@keyframes pulse{50%{opacity:.45}}
.stats{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;color:var(--ash)}
.stats b{color:var(--bone);font-weight:400;font-variant-numeric:tabular-nums}
.stats .g b{color:var(--gold)}
.chipbtn{font-family:var(--f-pixel);font-size:10px;color:var(--ash);background:rgba(0,0,0,.4);border:1px solid var(--rule);padding:3px 6px;cursor:pointer;margin-left:auto}
.chipbtn:hover{border-color:var(--ember);color:var(--bone)}
.ahead{display:flex;gap:4px;align-items:stretch}
.ahead .lbl{display:flex;align-items:center;color:var(--ember);padding-right:2px}
.slot{flex:1;display:flex;align-items:center;gap:5px;padding:3px 5px;border:1px solid #2b2433;background:rgba(0,0,0,.45);color:var(--ash);min-width:0}
.slot canvas{width:18px;height:18px;image-rendering:pixelated;flex:none}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.on{border-color:var(--ember);color:var(--bone);background:rgba(242,160,61,.1)}
.slot.wide{justify-content:center}

/* Controls */
#controls{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#controls button{pointer-events:auto;cursor:pointer}
.pad{width:60px;height:60px;display:grid;place-items:center;background:rgba(10,8,14,.72);border:2px solid var(--rule);color:var(--bone)}
.pad:hover,.pad:active{border-color:var(--ember);color:var(--ember)}
.pad svg{width:20px;height:20px;fill:currentColor}
.mid{display:flex;gap:6px}
.small{font-family:var(--f-pixel);font-size:10px;min-width:44px;height:36px;padding:0 8px;background:rgba(10,8,14,.72);border:2px solid var(--rule);color:var(--ash)}
.small:hover{border-color:var(--ember);color:var(--bone)}
.small[aria-pressed="true"]{border-color:var(--ember);color:var(--ember);background:rgba(242,160,61,.12)}
.small.fast{color:var(--ember)}

/* Toasts, region card, hurt flash */
#toasts{position:absolute;left:0;right:0;bottom:118px;z-index:4;display:grid;justify-items:center;gap:4px;pointer-events:none}
.toast{font-family:var(--f-pixel);font-size:11px;padding:3px 8px;background:rgba(0,0,0,.8);border:1px solid var(--rule);color:var(--bone);animation:toast 2s forwards}
.toast.good{color:var(--good)}
.toast.bad{color:var(--bad);border-color:#5a2a2a}
.toast.gold{color:var(--gold)}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#card{position:absolute;left:0;right:0;top:32%;z-index:4;text-align:center;pointer-events:none;opacity:0}
#card.show{animation:card 3.4s forwards}
#card .n{font-family:var(--f-pixel);font-size:11px;letter-spacing:.35em;color:var(--ember)}
#card .t{font-family:var(--f-display);font-size:46px;line-height:1;text-shadow:0 0 22px #000,0 2px 0 #000}
@keyframes card{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#hurt{position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 70px rgba(196,59,59,0);transition:box-shadow .35s}
#hurt.on{box-shadow:inset 0 0 70px rgba(196,59,59,.75);transition:none}

/* Event panel */
#panel{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;max-height:calc(100% - 132px);overflow:auto;background:var(--stone);border:2px solid var(--rule);box-shadow:0 0 0 2px #000,0 -30px 60px rgba(0,0,0,.75);padding:16px 14px 14px;animation:rise .28s ease-out}
#panel.tall{max-height:calc(100% - 16px)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.kicker{font-family:var(--f-pixel);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:29px;line-height:1.02;margin-top:3px}
.ev-head{display:flex;gap:12px;align-items:center}
.ev-head canvas{width:46px;height:46px;image-rendering:pixelated;flex:none}
.ev-text{line-height:1.55;margin:10px 0 14px;max-width:60ch}
.choices{display:grid;gap:8px}
.btn{display:block;width:100%;text-align:left;font-family:var(--f-pixel);font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.35;background:var(--stone-2);color:var(--bone);border:2px solid var(--rule);padding:10px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ember);box-shadow:0 0 14px rgba(242,160,61,.22)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn .key{color:var(--ember);margin-right:8px}
.btn .sub{display:block;margin-top:3px;font-family:var(--f-body);font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ash);line-height:1.35}
.btn.primary{border-color:var(--ember)}
.lines{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:4px;font-family:var(--f-pixel);font-size:11px}
.lines .good{color:var(--good)}
.lines .bad{color:var(--bad)}
.lines .note{color:var(--ash)}

/* Combat */
.combat{display:grid;gap:10px}
.foe{position:relative;display:grid;justify-items:center;gap:6px;text-align:center}
.foe canvas{width:132px;height:143px;image-rendering:pixelated;background:radial-gradient(circle at 50% 60%,rgba(242,160,61,.13),transparent 62%);animation:bob 1.6s steps(2) infinite}
.foe.boss canvas{width:168px;height:182px}
.foe canvas.hit{animation:shake .32s}
.foe canvas.dead{animation:sink .6s forwards}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes sink{to{transform:translateY(20px);opacity:0;filter:brightness(3)}}
.intent{font-family:var(--f-pixel);font-size:11px;padding:4px 9px;background:#000;border:1px solid var(--blood);color:#f2b4a6}
.intent.def{border-color:var(--ward);color:var(--ward)}
.intent.cur{border-color:var(--doom);color:var(--doom)}
.foe-name{font-family:var(--f-display);font-size:25px;line-height:1}
.foe .meter{width:min(240px,100%)}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-family:var(--f-pixel);font-size:9px;min-height:15px}
.tag{padding:2px 5px;border:1px solid var(--rule);color:var(--ash)}
.tag.block{border-color:var(--ward);color:var(--ward)}
.tag.doom{border-color:var(--doom);color:var(--doom)}
.tag.weak,.tag.bleed,.tag.rage{border-color:#6a2a2a;color:var(--bad)}
.tag.buff{border-color:var(--ember);color:var(--ember)}
.log{font-style:italic;color:var(--ash);text-align:center;min-height:1.5em;margin:0;line-height:1.4}
.me{position:relative;display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--rule)}
.me-row{display:flex;gap:8px;align-items:center}
.me-row .meter{flex:1}
.me-row .tags{justify-content:flex-end;min-width:0}
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.actions .btn{grid-column:span 2;text-align:center;padding:9px 6px}
.actions .btn.wide{grid-column:span 3}
.actions .btn .sub{font-size:12px}
.fx{position:absolute;left:50%;top:38%;z-index:2;font-family:var(--f-pixel);font-weight:700;font-size:18px;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;animation:up .95s ease-out forwards;transform:translateX(-50%);white-space:nowrap}
.fx.heal{color:var(--good)}
.fx.doom{color:var(--doom)}
.fx.ward{color:var(--ward)}
.fx.me{top:-6px}
.fx.proc{font-size:11px;font-weight:400;color:var(--ember);top:58%}
.fx.me.proc{top:16px}
.math{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;font-family:var(--f-pixel);font-size:10px;font-variant-numeric:tabular-nums}
.math .chip{padding:2px 5px;border:1px solid var(--rule);background:#000;color:var(--bone)}
.math .chip.relic{border-color:var(--ember);color:var(--ember)}
.math .chip.bad{border-color:#6a2a2a;color:var(--bad)}
.math .op{color:var(--ash)}
.math b{font-size:15px;font-weight:700;color:#fff;margin-left:2px}
.math .note{color:var(--ward);margin-left:4px}
.region .mode{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;color:var(--ember);border:1px solid var(--ember);padding:1px 4px;margin-left:8px;vertical-align:middle}
.relic.set-on{border-color:var(--ember)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .small.on{border-color:var(--ember);color:var(--ember)}
.beasts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.beast{display:grid;justify-items:center;gap:3px;padding:8px 6px;background:var(--stone-2);border:1px solid var(--rule);text-align:center;min-width:0}
.beast canvas{width:72px;height:78px;image-rendering:pixelated}
.beast .nm{font-family:var(--f-display);font-size:16px;line-height:1.1}
.beast .k{font-family:var(--f-pixel);font-size:8px;letter-spacing:.06em;color:var(--ash);text-transform:uppercase}
.beast.unseen .nm{color:var(--ash)}
.dark{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--stone-2);border:1px solid var(--ember)}
.dark .small{min-width:40px;font-size:16px}
.dark .small:disabled{opacity:.35}
.dark .nm{font-family:var(--f-display);font-size:22px;line-height:1}
.dark .ds{color:var(--ash);font-size:13.5px;line-height:1.4;margin-top:2px}
@keyframes up{to{transform:translate(-50%,-36px);opacity:0}}

/* Full screens */
#screen{position:absolute;inset:0;z-index:8;overflow:auto;display:flex;flex-direction:column;padding:28px 18px 22px;background:linear-gradient(180deg,rgba(10,8,14,.35) 0%,rgba(10,8,14,.86) 48%,rgba(10,8,14,.97) 100%)}
#screen.solid{background:rgba(10,8,14,.93)}
.title-wrap{margin-top:auto;display:grid;gap:6px}
.title{font-size:clamp(54px,15vw,76px);line-height:.88;color:var(--bone);text-shadow:0 0 26px rgba(242,160,61,.5),0 3px 0 #000}
.tagline{margin:4px 0 0;color:var(--ash);font-style:italic;line-height:1.45;max-width:34ch}
.menu{display:grid;gap:8px;margin-top:18px}
.foot{margin-top:14px;font-family:var(--f-pixel);font-size:9px;color:#6d6474;letter-spacing:.05em}
.page{display:grid;gap:14px;align-content:start}
.page h1{font-size:40px;line-height:1}
.page p{margin:0;line-height:1.55}
.back{justify-self:start;width:auto}
.embers{font-family:var(--f-pixel);font-size:12px;color:var(--ember)}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;background:var(--stone-2);border:1px solid var(--rule)}
.item .k,.item .nm{grid-column:1}
.item.locked{opacity:.55}
.item .k.got{color:var(--good)}
.item .k{font-family:var(--f-pixel);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.item .nm{font-family:var(--f-display);font-size:21px;line-height:1.05}
.item .ds{grid-column:1/-1;color:var(--ash);font-size:14px;line-height:1.4}
.item .btn{width:auto;padding:7px 10px;grid-row:1/3;grid-column:2;align-self:center}
.item.owned{opacity:.75}
.item.owned .k{color:var(--good)}
table.rec{width:100%;border-collapse:collapse;font-family:var(--f-pixel);font-size:10px;font-variant-numeric:tabular-nums}
.rec th{text-align:left;color:var(--ash);font-weight:400;padding:6px 4px;border-bottom:1px solid var(--rule)}
.rec td{padding:7px 4px;border-bottom:1px solid #241e2a}
.rec td.num,.rec th.num{text-align:right}
.rec .won{color:var(--ember)}
.score{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-family:var(--f-pixel);font-size:11px;font-variant-numeric:tabular-nums;padding:12px;background:var(--stone-2);border:1px solid var(--rule)}
.score .tot{padding-top:8px;border-top:1px solid var(--rule);color:var(--ember);font-size:13px}
.score span:nth-child(even){text-align:right}
.rules{display:grid;gap:12px}
.rules h3{font-family:var(--f-pixel);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember);margin:4px 0 0;font-weight:400}
.rules ul{margin:0;padding-left:18px;display:grid;gap:5px;line-height:1.5}
.cls{display:grid;gap:3px}
.cls .stat{font-family:var(--f-pixel);font-size:9px;color:var(--ash);letter-spacing:.06em}

/* Sheet (pause, relics) */
#sheet{position:absolute;inset:0;z-index:9;display:grid;place-items:center;padding:18px;background:rgba(5,4,8,.78)}
#sheet .box{width:100%;max-height:100%;overflow:auto;background:var(--stone);border:2px solid var(--rule);box-shadow:0 0 0 2px #000;padding:16px 14px;display:grid;gap:12px}
.relic{padding:8px 10px;background:var(--stone-2);border:1px solid var(--rule)}
.relic b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;line-height:1.1}
.relic span{color:var(--ash);font-size:14px}

@media (prefers-reduced-motion:reduce){
  #panel,.foe canvas,.foe canvas.hit,.fx,#card.show{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .fx{animation:none!important;opacity:0}
}
</style>

<div id="app">
  <div id="frame">
    <canvas id="world" aria-label="The road ahead"></canvas>
    <div id="hurt"></div>
    <header id="hud" hidden></header>
    <div id="toasts" aria-live="polite"></div>
    <div id="card"><div class="n"></div><div class="t"></div></div>
    <div id="controls" hidden>
      <button class="pad" id="btnL" aria-label="Move left"><svg viewBox="0 0 10 10"><path d="M7 1v8L2 5z"/></svg></button>
      <div class="mid">
        <button class="small" id="btnSpeed" aria-label="Game speed">1×</button>
        <button class="small" id="btnAuto" aria-pressed="false">Auto</button>
        <button class="small" id="btnPause" aria-label="Pause">Pause</button>
      </div>
      <button class="pad" id="btnR" aria-label="Move right"><svg viewBox="0 0 10 10"><path d="M3 1v8l5-4z"/></svg></button>
    </div>
    <section id="panel" hidden></section>
    <section id="screen" hidden></section>
    <div id="sheet" hidden></div>
  </div>
</div>

<script>
'use strict';
// ───────────────────────── constants & utils
const W = 120;
let H = 214, PY = H - 40;
const LANES = [36, 60, 84];
const ROAD_L = 22, ROAD_R = 98;
const SPACING = 96, FIRST = 80;
const BASE_SPEED = 16;          // world pixels per second at 1×
const OIL_PER_PX = 1 / 22;      // lantern oil burned per pixel walked
const DARK_STEP = 24;           // pixels walked in darkness per 1 HP lost

const $ = s => document.querySelector(s);
// Gameplay randomness comes from the run's own seeded generator (mulberry32), so the Daily Road is the same
// road for everyone and a saved run resumes the same way. Visual effects use vrand, which never touches the seed.
function rng() {
  if (!run) return Math.random();
  let t = run.seed = (run.seed + 0x6D2B79F5) | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function withSeed(seed, fn) { const saved = run.seed; run.seed = seed | 0; try { return fn(); } finally { run.seed = saved; } }
const vrand = (a, b) => a + Math.random() * (b - a);
const rand = (a, b) => a + rng() * (b - a);
const ri = (a, b) => Math.floor(a + rng() * (b - a + 1));
const pick = a => a[Math.floor(rng() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const strSeed = s => { let x = 2166136261; for (const ch of s) x = Math.imul(x ^ ch.charCodeAt(0), 16777619); return x | 0; };
const sleep = ms => new Promise(r => setTimeout(r, ms / speed)); // combat pacing follows the game speed
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function hash(n) { n |= 0; n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
const h2 = (a, b) => hash(Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263));
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'disabled') el.disabled = !!v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

const spriteCache = new Map();
function sprite(map, pal, key) {
  if (spriteCache.has(key)) return spriteCache.get(key);
  const w = Math.max(...map.map(r => r.length)), hh = map.length;
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const x = c.getContext('2d');
  map.forEach((row, y) => { for (let i = 0; i < row.length; i++) { const col = pal[row[i]]; if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); } } });
  spriteCache.set(key, c);
  return c;
}

    else if (i % 2 === 1) {

      const opts = [];

function render(t) {

function update(dt) {

    saveTimer += dt; if (saveTimer > 2) { saveTimer = 0; saveRun(); }

// ── Daily Road: one shared road per calendar day, the same seed and class for every player.
function todayKey(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dailyClass(key) { const ids = Object.keys(CLASSES); return ids[(strSeed(key) >>> 0) % ids.length]; }
const dailyResult = key => meta.daily.results.find(r => r.date === key);
function startDaily() {
  if (loadSavedRun()) return showInProgress(startDaily);
  const key = todayKey();
  if (dailyResult(key)) return;
  startRun(dailyClass(key), { seed: strSeed('lantern-road:' + key), daily: key });
}
function recordDaily(key, total, won) {

  dly.results.push({ date: key, score: total, won }); dly.results = dly.results.slice(-30);
  const yesterday = (() => { const [y, m, d] = key.split('-').map(Number); const t = new Date(y, m - 1, d - 1); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; })();

}

  if (won) total = Math.round((total + 500) * 1.5);
  total = Math.round(total * darkMult(run.dark));
  let embers = Math.max(1, Math.floor(total / 100));
  if (run.daily) embers *= 2;
  meta.embers += embers; meta.runs++;
  meta.records.push({ score: total, cls: run.cls, region: run.region, won, date: todayKey(), dark: run.dark, daily: !!run.daily });
  meta.records.sort((a, b) => b.score - a.score); meta.records = meta.records.slice(0, 10);
  const prevDark = meta.dark;
  if (won && run.dark >= meta.dark && meta.dark < 5) meta.dark = run.dark + 1;
  if (run.daily) recordDaily(run.daily, total, won);
  commitMeta();
  award('first');
  if (won) { award('win_' + run.cls); if (run.dark >= 1) award('dark1'); if (run.dark >= 5) award('dark5'); }
  if (run.daily) { award('daily1'); if (meta.daily.streak >= 3) award('streak3'); if (meta.daily.streak >= 7) award('streak7'); }
  lastRun = { won, cause, total, embers, gold, kills: run.kills, elites: run.elites, bosses: run.bosses, regions: run.regionsCleared, region: run.region, cls: run.cls,
    dark: run.dark, daily: run.daily, newAch: run.newAch.slice(), unlockedDark: meta.dark > prevDark ? meta.dark : 0,
    best: meta.records[0] && meta.records[0].score === total };

}

      li('Every walk earns 1 ember per 100 points. Spend embers at the Pyre to unlock classes, relics and events. Achievements earn embers too.')),
    h('h3', { text: 'Daily Road and Darkness' }), h('ul', {},
      li('The Daily Road is one shared road per day: the same class, foes and forks for every player. You get one walk at it, it earns double embers, and playing on consecutive days builds a streak.'),
      li('Win a walk to unlock the next Darkness level, up to Darkness V. Each level makes the road harder and multiplies your score by an extra 0.25.')));
}
function showHowTo(back) {
  screen = 'howto';
  setScreen(h('div', { class: 'page' }, menuBtn('← Back', null, back), h('div', { class: 'kicker', text: 'Rules' }), h('h1', { text: 'How to Play' }), howToContent()), true);
  scr.querySelector('.btn').classList.add('back');
}
function showEnd() {
  screen = 'end';

    h('h1', { text: r.won ? 'The Hollow King is Ended' : `You Fell in the ${R.name}` }),

    h('div', { class: 'score' },
      row(`Enemies slain · ${r.kills} × 10`, r.kills * 10), row(`Elites slain · ${r.elites} × 50`, r.elites * 50),
      row(`Bosses ended · ${r.bosses} × 200`, r.bosses * 200), row(`Regions cleared · ${r.regions} × 100`, r.regions * 100),
      row('Gold held', r.gold),
      r.won ? row('Victory bonus', 500) : null, r.won ? row('Victory multiplier', '× 1.5') : null,
      r.dark ? row(DARKNESS[r.dark].name, `× ${darkMult(r.dark)}`) : null,
      h('span', { class: 'tot', text: r.best ? 'Final score · new best' : 'Final score' }), h('span', { class: 'tot', text: r.total })),
    h('div', { class: 'embers', text: `+${r.embers} ember${r.embers === 1 ? '' : 's'}${r.daily ? ' (doubled for the Daily Road)' : ''} · ${meta.embers} total` }),
    r.daily ? h('p', { class: 'tagline', text: `Daily streak: ${meta.daily.streak} day${meta.daily.streak === 1 ? '' : 's'}. A new road opens tomorrow.` }) : null,
    r.unlockedDark ? h('p', { class: 'tagline', text: `${DARKNESS[r.unlockedDark].name} unlocked: ${DARKNESS[r.unlockedDark].desc}` }) : null,
    achs.length ? h('div', { class: 'list' }, achs.map(a => h('div', { class: 'item' }, h('div', { class: 'k', text: `Achievement · +${a.embers} embers` }), h('div', { class: 'nm', text: a.name }), h('div', { class: 'ds', text: a.desc })))) : null,
    h('div', { class: 'menu' }, menuBtn('Walk again', null, beginWalk, true), menuBtn('The Pyre', `${meta.embers} embers to spend`, showPyre), menuBtn('Title', null, showTitle))));
}

// ── Codex: achievements, the foes you have defeated, and the relics you have found.
function silhouette(c) { const x = c.getContext('2d'); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#2e2738'; x.fillRect(0, 0, c.width, c.height); return c; }
function showCodex(tab) {
  screen = 'codex';
  const tabs = h('div', { class: 'tabs', role: 'tablist' }, [['ach', 'Achievements'], ['foes', 'Bestiary'], ['relics', 'Relics']].map(([id, label]) =>
    h('button', { class: 'small' + (tab === id ? ' on' : ''), role: 'tab', 'aria-selected': tab === id ? 'true' : 'false', onclick: () => showCodex(id), text: label })));
  let body;
  if (tab === 'ach') {
    body = h('div', { class: 'list' }, ACHIEVEMENTS.map(a => { const got = meta.ach.includes(a.id);
      return h('div', { class: 'item' + (got ? '' : ' locked') }, h('div', { class: 'k' + (got ? ' got' : ''), text: got ? `Earned · +${a.embers} embers` : `+${a.embers} embers` }), h('div', { class: 'nm', text: a.name }), h('div', { class: 'ds', text: a.desc })); }));
  } else if (tab === 'foes') {
    const ids = REGIONS.flatMap(R => [...R.normals, R.elite, R.boss]).concat(['mimic', 'moths']);
    body = h('div', { class: 'beasts' }, ids.map(id => { const n = meta.foes[id] || 0, d = ENEMIES[id];
      const where = REGIONS.find(R => R.normals.includes(id) || R.elite === id || R.boss === id);
      const pc = portrait(id); if (!n) silhouette(pc);
      return h('div', { class: 'beast' + (n ? '' : ' unseen') }, pc, h('div', { class: 'nm', text: n ? d.name : 'Unknown' }), h('div', { class: 'k', text: n ? `Defeated ×${n}` : (where ? where.name : 'A mystery') })); }));
  } else {
    body = h('div', { class: 'list' }, Object.keys(RELICS).map(id => { const seen = meta.relicsSeen.includes(id), R = RELICS[id];
      return h('div', { class: 'item' + (seen ? '' : ' locked') }, h('div', { class: 'k', text: (R.tag ? TAG_NAMES[R.tag] : 'Relic') + (seen ? '' : ' · not found yet') }), h('div', { class: 'nm', text: seen ? R.name : '???' }), h('div', { class: 'ds', text: seen ? R.desc : 'Find it on the road to learn what it does.' })); }));
  }
  const setsInfo = tab === 'relics' ? h('div', { class: 'list' }, Object.keys(SETS).map(t => h('div', { class: 'item' }, h('div', { class: 'k', text: `${TAG_NAMES[t]} set · carry 3 ${TAG_NAMES[t]} relics` }), h('div', { class: 'nm', text: SETS[t].name }), h('div', { class: 'ds', text: SETS[t].desc })))) : null;
  setScreen(h('div', { class: 'page' }, menuBtn('← Back', null, showTitle), h('div', { class: 'kicker', text: 'What you have learned' }), h('h1', { text: 'Codex' }), tabs, setsInfo, body), true);
  scr.querySelector('.btn').classList.add('back');
}

// ───────────────────────── sheet: pause and relics
const sheet = $('#sheet');
function openSheet(el) { sheet.replaceChildren(h('div', { class: 'box', role: 'dialog' }, el)); sheet.hidden = false; const b = sheet.querySelector('.btn'); if (b) b.focus({ preventScroll: true }); }
function closeSheet() { sheet.hidden = true; sheet.replaceChildren(); }
function openRelics() {
  if (!run) return; const wasPaused = paused; paused = true;
  const close = () => { closeSheet(); paused = wasPaused; };
  const list = run.relics.length ? run.relics.map(id => h('div', { class: 'relic' }, h('b', { text: relicLabel(id) }), h('span', { text: RELICS[id].desc })))
    : [h('p', { class: 'ev-text', text: 'No relics yet. Elites, shrines, merchants and bosses carry them.' })];
  const sets = Object.keys(SETS).filter(t => tagCount(t) > 0).map(t => h('div', { class: 'relic' + (setOn(t) ? ' set-on' : '') },
    h('b', { text: `${SETS[t].name} · ${TAG_NAMES[t]} ${Math.min(3, tagCount(t))}/3${setOn(t) ? ' · active' : ''}` }), h('span', { text: SETS[t].desc })));
  const c = CLASSES[run.cls];
  openSheet(h('div', { style: 'display:grid;gap:10px' },
    h('div', { class: 'kicker', text: `${c.name} · Strike ${strikeBase()} · Guard ${guardVal()}` }), h('h2', { text: 'Your Relics' }),
    h('p', { class: 'ev-text', style: 'margin:0', text: `${c.skill.name} (level ${run.skillLv}): ${c.skill.desc(run.skillLv)} ${c.passive}` }),
    ...sets, ...list, h('button', { class: 'btn primary', onclick: close, text: 'Close' })));
}
function togglePause() {
  if (!run || screen !== 'travel') return;
  if (!sheet.hidden) { closeSheet(); paused = false; return; }
  openPause();
}
function openPause(confirming) {
  paused = true;
  const resume = () => { closeSheet(); paused = false; };
  openSheet(h('div', { style: 'display:grid;gap:10px' },
    h('div', { class: 'kicker', text: 'Paused' }), h('h2', { text: confirming ? 'Abandon this walk?' : 'Rest a Moment' }),
    confirming ? h('p', { class: 'ev-text', style: 'margin:0', text: 'The walk ends now and is scored as it stands. You still earn embers.' }) : null,
    confirming
      ? [menuBtn('Yes, abandon the walk', null, () => { closeSheet(); paused = false; if (run) { run.dead = 'Turned back in the ' + regionName(); endRun(false, run.dead); } }), menuBtn('Keep walking', null, resume, true)]
      : [menuBtn('Resume', null, resume, true),
        menuBtn(muted ? 'Sound: off' : 'Sound: on', 'Toggle sound effects', () => { muted = !muted; try { localStorage.setItem('lantern-road-muted', muted ? '1' : '0'); } catch (e) { } openPause(); }),
        menuBtn('How to play', null, () => openSheet(h('div', { style: 'display:grid;gap:10px' }, h('h2', { text: 'How to Play' }), howToContent(), menuBtn('Back', null, () => openPause(), true)))),
        menuBtn('Abandon walk', 'End this walk and keep your score', () => openPause(true))]));
}

// ───────────────────────── auto mode
// When on, the game plays itself: it picks forks, chases pickups, fights and answers events.
let autoAt = 0;
const autoDelay = () => 750 / speed;
function forkScore(t) {
  const hp = run.hp / run.maxHp;
  switch (t) {
    case 'camp': return hp < .5 ? 10 : run.skillLv < 3 ? 4 : 2;
    case 'merchant': return run.gold >= 40 ? 6 : 1;
    case 'elite': return hp > .7 ? 7 : 0;
    case 'treasure': return 5;
    case 'mystery': return 4;
    case 'shrine': return run.gold >= 35 + 5 * run.region || hp > .6 ? 4 : 1;
    case 'fight': return hp > .4 ? 3 : 1;
  }
  return 0;
}
function bestLane(opts) {
  let best = run.lane, bestScore = -Infinity;
  opts.forEach((o, l) => { const s = forkScore(o) - Math.abs(l - run.lane) * .01; if (s > bestScore) { bestScore = s; best = l; } });
  return best;
}
function autoSteer() {
  const b = run.beats[run.beatIdx];
  let target = run.lane;
  const forkNear = b && b.kind === 'fork' && beatPos(run.beatIdx) - run.dist < 70;
  if (forkNear) target = bestLane(b.opts);
  else {
    const p = run.pickups.find(p => !p.done && p.pos > run.dist && p.pos - run.dist < 60);
    if (p) target = p.lane; else if (b && b.kind === 'fork') target = bestLane(b.opts);
  }
  if (target !== run.lane) move(Math.sign(target - run.lane));
}
function autoCombat() {
  const it = intentOf(), s = C.e.str;
  const inc = 'ADL'.includes(it.t) ? it.n + s : it.t === 'M' ? (it.n + s) * it.x : 0;
  if (run.draughts && run.hp < run.maxHp * .35) return act('draught');
  if (C.cd === 0) return act('skill');
  if (inc >= 10 || (run.cls === 'sellsword' && inc >= guardVal() && !C.riposte)) return act('guard');
  return act('strike');
}
function autoTick(now) {
  if (!auto || !run || run.over || screen !== 'travel' || paused || !sheet.hidden) return;
  if (!run.event) return autoSteer();
  if (now < autoAt) return;
  if (C && C.ui && !C.over) {
    if (C.busy) return;
    autoAt = now + autoDelay();
    return autoCombat();
  }
  if (panel.hidden) return;
  autoAt = now + autoDelay();
  const btns = [...panel.querySelectorAll('.btn[data-k]')], open = btns.filter(b => !b.disabled);
  const i = panelPick ? panelPick() : 0;
  const b = i === -1 ? open[open.length - 1] : (btns[i] && !btns[i].disabled ? btns[i] : open[0]);
  if (b) b.click();
}

// ───────────────────────── input
$('#btnL').addEventListener('click', () => move(-1));
$('#btnR').addEventListener('click', () => move(1));
$('#btnPause').addEventListener('click', togglePause);
function syncPlayButtons() {
  const sb = $('#btnSpeed'), ab = $('#btnAuto');
  sb.textContent = speed + '×'; sb.classList.toggle('fast', speed > 1);
  ab.setAttribute('aria-pressed', auto ? 'true' : 'false'); ab.textContent = auto ? 'Auto on' : 'Auto';
}
function cycleSpeed() { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; savePlayPrefs(); syncPlayButtons(); }
function toggleAuto() { auto = !auto; autoAt = performance.now() + autoDelay(); savePlayPrefs(); syncPlayButtons(); toast(auto ? 'Auto mode on' : 'Auto mode off'); }
$('#btnSpeed').addEventListener('click', cycleSpeed);
$('#btnAuto').addEventListener('click', toggleAuto);
syncPlayButtons();
cv.addEventListener('pointerdown', e => {
  if (!run || screen !== 'travel') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < .4) move(-1); else if (x > .6) move(1);
});
document.addEventListener('keydown', e => {
  const k = e.key;
  if (!sheet.hidden) { if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); togglePause(); } return; }
  if (/^[1-9]$/.test(k) && !panel.hidden) {
    const b = panel.querySelector(`.btn[data-k="${k}"]`);
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
    return;
  }
  if (screen !== 'travel' || !run) return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); move(-1); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); move(1); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); togglePause(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && run && screen === 'travel' && !run.event && sheet.hidden) openPause(); if (document.hidden) saveRun(); });
window.addEventListener('pagehide', saveRun);
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#app'));

// ───────────────────────── boot
function start(data) {
  resize();
  if (data && data.run && data.meta) {
    run = data.run; meta = normalizeMeta(data.meta); screen = 'travel'; scr.hidden = true;
    run.event = false; C = null; openPause();
  } else showTitle();
  requestAnimationFrame(loop);
  initCloud();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ meta, run: run && screen === 'travel' && !run.event && !run.over ? run : null }));
} catch (e) { }
(() => {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
